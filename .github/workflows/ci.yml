name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs can include the real-model suite (see the model-tests job).
  workflow_dispatch:
    inputs:
      run_model_tests:
        description: "Also run tests that load the real BAAI/bge-small-en-v1.5 model (CPU torch, ~1 GB download)"
        type: boolean
        default: false

jobs:
  frontend:
    name: Frontend lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc -b --noEmit
      - name: Production build
        run: npm run build
      - name: Dependency audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend lint, typecheck, unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gripper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gripper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Owner: migrations + fixture seeding only.
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gripper_test
      # Runtime: restricted role (NOSUPERUSER, NOBYPASSRLS, not owner). Created below.
      DATABASE_URL: postgresql://gripper_app:gripper_app_ci@localhost:5432/gripper_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-0123456789abcdef
      ENVIRONMENT: test
      # Integration tests FAIL (instead of skipping) if Postgres/Redis are missing.
      REQUIRE_INTEGRATION: "1"
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.lock
      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt -c requirements-ci.lock
      - name: Vercel requirements match backend runtime pins
        working-directory: .
        run: |
          diff <(grep -E '^[A-Za-z]' requirements.txt | sort) \
               <(grep -E '^[A-Za-z]' backend/requirements-base.txt | sort)
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements-ci.txt
      - name: Ruff (entire backend)
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Unit tests (no database; includes real BGE tokenizer checks via vendored tokenizer.json)
        run: pytest tests -m "not integration and not model" -q
      - name: Create pgvector extension
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          url = os.environ["MIGRATION_DATABASE_URL"].replace("postgresql://", "postgresql+psycopg2://")
          with create_engine(url).begin() as conn:
              conn.execute(text("CREATE EXTENSION IF NOT EXISTS vector"))
          PY
      - name: Migrations (owner role)
        run: alembic upgrade head
      - name: Migration round trip (downgrade Phase 1 revisions, re-upgrade)
        run: alembic downgrade f4de4f049821 && alembic upgrade head
      - name: Create restricted runtime role
        run: APP_DB_USER=gripper_app APP_DB_PASSWORD=gripper_app_ci python scripts/create_app_role.py
      - name: Verify runtime role cannot bypass RLS
        run: python scripts/check_db_role.py > /dev/null
      - name: Integration tests (real Postgres + pgvector + Redis, restricted role)
        run: pytest tests -m integration -v --tb=short

  model-tests:
    name: Real embedding model tests (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_model_tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-key-0123456789abcdef
      ENVIRONMENT: test
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime + CPU-only torch + sentence-transformers
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt -c requirements-ci.lock sentence-transformers==6.3.0
      - name: Model tests (downloads BAAI/bge-small-en-v1.5 from the Hugging Face Hub)
        run: pytest tests -m model -v
