name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gripper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gripper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Owner: migrations + fixture seeding only.
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gripper_test
      # Runtime: restricted role (NOSUPERUSER, NOBYPASSRLS, not owner). Created below.
      DATABASE_URL: postgresql://gripper_app:gripper_app_ci@localhost:5432/gripper_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-0123456789abcdef
      ENVIRONMENT: test
      REQUIRE_INTEGRATION: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.lock
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt -c requirements-ci.lock
      - name: Check Vercel requirements match backend runtime pins
        run: |
          diff <(grep -E '^[A-Za-z]' requirements.txt | sort) \
               <(grep -E '^[A-Za-z]' backend/requirements-base.txt | sort)
      - name: Dependency vulnerability audit
        working-directory: backend
        run: pip-audit -r requirements-ci.txt
      - name: Create pgvector extension
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          url = os.environ["MIGRATION_DATABASE_URL"].replace("postgresql://", "postgresql+psycopg2://")
          engine = create_engine(url)
          with engine.begin() as conn:
              result = conn.execute(text("SELECT extversion FROM pg_extension WHERE extname='vector'"))
              row = result.fetchone()
              if row:
                  print("vector already installed, version:", row[0])
              else:
                  conn.execute(text("CREATE EXTENSION vector"))
                  print("vector extension: created")
          PY
      - name: Run migrations
        working-directory: backend
        run: |
          if ! alembic upgrade head -v 2>&1 | tee /tmp/alembic_out.txt; then
            echo "## Alembic migration failure" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/alembic_out.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Create restricted runtime role
        working-directory: backend
        run: APP_DB_USER=gripper_app APP_DB_PASSWORD=gripper_app_ci python scripts/create_app_role.py
      - name: Verify runtime role cannot bypass RLS
        working-directory: backend
        run: python scripts/check_db_role.py > /dev/null
      - name: Ruff lint
        working-directory: backend
        run: ruff check tests app/core/rbac.py app/api/deps.py app/db/migrate.py
      - name: Pytest
        working-directory: backend
        run: |
          if ! pytest tests/ -v --tb=short 2>&1 | tee /tmp/pytest_out.txt; then
            echo "## Pytest failures" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/pytest_out.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
