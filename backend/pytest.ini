[pytest]
testpaths = tests
pythonpath = .
markers =
    model: loads the real BAAI/bge-small-en-v1.5 model (needs sentence-transformers/torch and the model download); run with: pytest -m model
    integration: needs PostgreSQL+pgvector (restricted runtime role) and Redis; skipped when absent unless REQUIRE_INTEGRATION=1
filterwarnings =
    ignore::DeprecationWarning
